[package]
name = "wpnexp"
version = "1.0.0"
authors = ["battleship789"]
edition = "2021"

[package.metadata.skyline]
titleid = "0100a6301214e000" # Fire Emblem Engage

[lib]
crate-type = ["cdylib"]

[workspace]
resolver = "2"
members = [
    ".",
    "crates/wpnexp_lib",
]

[workspace.dependencies]
engage-il2cpp = { git = "https://github.com/DivineDragonFanClub/engage-il2cpp", tag = "0.1.2", default-features = false }
unity-nx = { git = "https://github.com/DivineDragonFanClub/unity-nx", tag = "0.1.2" }
cobapi = { git = "https://github.com/DivineDragonFanClub/cobapi", tag = "0.1.3"}
skyline = "0.6.0"
serde = "1.0.228"
serde_derive = "1.0.228"
serde_json = "1.0.150"

[dependencies]
wpnexp_lib = { path = "crates/wpnexp_lib" }
skyline = { workspace = true }
unity-nx = { workspace = true }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
